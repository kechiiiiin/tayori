name = "tayori"
main = "src/index.ts"
# wrangler 4.131.2 同梱の workerd が対応する日付（家族掲示板と同じ）
compatibility_date = "2026-08-22"

# 公開口は Access で守った Custom Domain だけ。workers.dev とプレビュー URL は閉じる
workers_dev = false
preview_urls = false

[[routes]]
pattern = "tayori.kechiiiiin.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "tayori"
# 2026-11-18 `wrangler d1 create tayori` で作成
database_id = "84cf27f8-4a6b-4b8e-919d-b53f8baa802d"
migrations_dir = "migrations"

# 30 分ごとにフィードを取りに行く（src/index.ts の scheduled）
[triggers]
crons = ["*/30 * * * *"]

[vars]
# cron 1回で取りに行くフィードの数（取ってから時間がたった順）。
# Workers Free は 1 回の実行で subrequest（fetch と D1 の問い合わせ）50 まで → 15 本ほど。Workers Paid なら 200 などに上げてよい
FETCH_PER_RUN = "15"
# 「メイン」の新着のプッシュの宛先（apns-topic）。sandbox／本番は端末ごとにアプリが申告する（PUT /api/devices）
APNS_BUNDLE_ID = "jp.kechiiiiin.tayori"

[observability]
enabled = true

# Access の JWT の検証は関所（sekisho）に Service Binding の RPC で聞く（src/auth.ts）
[[services]]
binding = "SEKISHO"
service = "sekisho"

# 秘密は `wrangler secret put <名前>` で入れる（ローカルは .dev.vars・コミットしない）:
#   CF_ACCESS_AUD               Access アプリ tayori の AUD
#   ACCESS_SERVICE_CLIENT_IDS   通すサービストークンの Client ID（カンマ区切り）。未設定なら1本も通さない
#   MCP_TOKENS                  /mcp（Access の外）の Bearer トークン（カンマ区切り・各32文字以上）。未設定なら /mcp は全部 401
#   APNS_KEY                    APNs の .p8 の中身（PEM まるごと・家族掲示板と同じ鍵でよい＝チーム共通）
#   APNS_KEY_ID                 その鍵の Key ID
#   APNS_TEAM_ID                Apple Developer の Team ID
# APNS_* が1つでも欠けているとプッシュは送らない（取得・一覧は動く）
# ⚠️ DEV_BYPASS_AUTH をここ（[vars]）に書かない
