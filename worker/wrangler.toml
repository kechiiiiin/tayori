name = "tayori"
main = "src/index.ts"
# wrangler 4.131.2 同梱の workerd が対応する日付（家族掲示板と同じ）
compatibility_date = "2026-08-22"

# 公開口は Access で守った Custom Domain だけ。workers.dev とプレビュー URL は閉じる
workers_dev = false
preview_urls = false

[[routes]]
pattern = "tayori.kechiiiiin.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "tayori"
# `wrangler d1 create tayori` の出力で置き換える（まだ作っていない）
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 30 分ごとにフィードを取りに行く（src/index.ts の scheduled）
[triggers]
crons = ["*/30 * * * *"]

[vars]
# cron 1回で取りに行くフィードの数（取ってから時間がたった順）。
# Workers Free は 1 回の実行で subrequest（fetch と D1 の問い合わせ）50 まで → 15 本ほど。Workers Paid なら 200 などに上げてよい
FETCH_PER_RUN = "15"

[observability]
enabled = true

# Access の JWT の検証は関所（sekisho）に Service Binding の RPC で聞く（src/auth.ts）
[[services]]
binding = "SEKISHO"
service = "sekisho"

# 秘密は `wrangler secret put <名前>` で入れる（ローカルは .dev.vars・コミットしない）:
#   CF_ACCESS_AUD               Access アプリ tayori の AUD
#   ACCESS_SERVICE_CLIENT_IDS   通すサービストークンの Client ID（カンマ区切り）。未設定なら1本も通さない
# ⚠️ DEV_BYPASS_AUTH をここ（[vars]）に書かない
